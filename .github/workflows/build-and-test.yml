name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: windows-latest
    if: github.repository == 'gromedev/mgx'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          # 8.0.x is what src/ targets and ships; 10.0.x is only for the test project,
          # which stays on net10.0 so it can host the newest PowerShell SDK.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Mgx.slnx

      - name: Install platyPS
        shell: pwsh
        run: |
          # build.ps1 regenerates the compiled help from module/help and refuses to build without
          # this. Help that is not regenerated ships stale, which is how Get-Help came to describe
          # output shapes two releases out of date.
          Install-PSResource -Name platyPS -TrustRepository -Scope AllUsers

      - name: Build module
        shell: pwsh
        run: ./build.ps1 -Configuration Release

      - name: Run xUnit tests
        run: >
          dotnet test tests/Mgx.IntegrationTests/Mgx.IntegrationTests.csproj
          --configuration Release --no-build
          --logger "trx;LogFileName=xunit-results.trx"
          --results-directory TestResults

      # A run that executes nothing exits 0 and looks identical to a run that executes
      # everything, so assert on the count as well as the exit code. The floor is the exact
      # measured total - a handful of tests early-return on hosts that cannot exercise them,
      # but every test executes and counts on every leg, so each leg reports the same number,
      # and slack in the floor is just that many tests free to disappear unnoticed. Raise it
      # with the suite.
      - name: Assert xUnit actually ran
        shell: pwsh
        run: |
          $floor = 3380
          $trx = Get-ChildItem TestResults -Filter *.trx | Select-Object -First 1
          if (-not $trx) { throw "No .trx produced - the test run did not report results." }
          $c = ([xml](Get-Content $trx.FullName -Raw)).TestRun.ResultSummary.Counters
          "xUnit executed $($c.total) test(s): $($c.passed) passed, $($c.failed) failed" | Write-Host
          if ([int]$c.total -lt $floor) {
              throw "Only $($c.total) xUnit tests executed, expected at least $floor. The suite is not running."
          }

      - name: Install test prerequisites
        shell: pwsh
        run: |
          # Pester drives the surface tests. Microsoft.Graph.Authentication is NOT a
          # declared dependency (mgx resolves auth reflectively), so importing works
          # without it - but the live-tagged tests need a real token, so install it here.
          Install-PSResource -Name Pester -TrustRepository -Scope AllUsers
          Install-PSResource -Name Microsoft.Graph.Authentication -TrustRepository -Scope AllUsers

      - name: Run Pester tests
        shell: pwsh
        run: |
          Import-Module ./tests/TestHarness.psm1
          $result = Invoke-TestHarness -IgnoreCodeCoverage
          "Pester executed $($result.TotalCount): $($result.PassedCount) passed, $($result.FailedCount) failed, $($result.SkippedCount) skipped" | Write-Host
          # FailedCount alone misses a container that never ran - a parse error or a top-level
          # throw fails the container with FailedCount still 0, so Result and
          # FailedContainersCount are checked too, and both gates on this leg (and the compat
          # leg's twin below) trip on the same condition.
          if ($result.FailedCount -gt 0 -or $result.FailedContainersCount -gt 0 -or $result.Result -ne 'Passed') {
              $failed = $result.FailedContainers | ForEach-Object { $_.Name }
              throw "$($result.FailedCount) Pester test(s) failed, $($result.FailedContainersCount) container(s) failed: $($failed -join ', ')"
          }
          # Silence is not success here either. This floor keeps a small margin rather than
          # sitting on the measured total, because the number it has to hold on is the one the
          # compat leg below reports and that host is not this one. Raise both together.
          $floor = 333
          $ran = [int]$result.PassedCount + [int]$result.SkippedCount
          if ($ran -lt $floor) {
              throw "Only $ran Pester test(s) ran, expected at least $floor. The suite is not running."
          }

      - name: Validate module manifest
        shell: pwsh
        run: |
          Test-ModuleManifest -Path ./module/mgx.psd1 -ErrorAction Stop
          $module = Import-Module ./module/mgx.psd1 -PassThru -ErrorAction Stop
          if ($module.ExportedCmdlets.Count -eq 0) {
              throw 'Module imported but exports no cmdlets.'
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults/
            tests/TestResults.xml
          if-no-files-found: ignore

  # The manifest claims PowerShell 7.4+. That claim is only honest if the supported range
  # actually imports the module and passes the surface tests, so its ends each get a leg:
  # 7.4 is the LTS floor, and the newest release is the "+". Without this job the floor is
  # an assertion rather than a result. The middle of the range is not covered - a 7.5-only
  # regression reaches a user before it reaches CI, which is the accepted cost of the trim.
  compat:
    name: PowerShell ${{ matrix.psversion }}
    runs-on: windows-latest
    needs: build-and-test
    if: github.repository == 'gromedev/mgx'
    strategy:
      fail-fast: false
      matrix:
        psversion: ['7.4', '7.6']
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install PowerShell ${{ matrix.psversion }}
        shell: pwsh
        run: |
          dotnet tool install --global PowerShell --version '${{ matrix.psversion }}.*'
          "$env:USERPROFILE\.dotnet\tools" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Install platyPS
        shell: pwsh
        run: |
          # build.ps1 regenerates the compiled help from module/help and refuses to build without
          # this. Help that is not regenerated ships stale, which is how Get-Help came to describe
          # output shapes two releases out of date.
          Install-PSResource -Name platyPS -TrustRepository -Scope AllUsers

      - name: Build module
        shell: pwsh
        run: ./build.ps1 -Configuration Release

      # Written to a file and invoked with -File rather than passed to -Command: nesting a
      # double-quoted PowerShell command inside a YAML run block invites bash-style \$ escaping,
      # where PowerShell needs a backtick. Keep `shell: pwsh` on this step so the here-string
      # reaches the inner host intact.
      - name: Import and run surface tests on ${{ matrix.psversion }}
        shell: pwsh
        run: |
          $probe = @'
          "running on PowerShell $($PSVersionTable.PSVersion.ToString())" | Write-Host
          # Assert the pin took effect. Printing the version proves nothing: if the install or
          # PATH precedence silently gave us the wrong host, both matrix legs would test the same
          # runtime and stay green while claiming to cover two.
          $want = $env:MGX_EXPECT_PSVERSION
          $got  = "$($PSVersionTable.PSVersion.Major).$($PSVersionTable.PSVersion.Minor)"
          if ($want -and $got -ne $want) { throw "expected PowerShell $want, got $got - the version pin did not take effect" }
          Install-PSResource -Name Pester -TrustRepository -Scope CurrentUser
          Import-Module ./module/mgx.psd1 -ErrorAction Stop
          # Through the harness, not Invoke-Pester directly: tests/Unit contains Live-tagged
          # blocks that need a real Graph session, and only the harness filters them out.
          Import-Module ./tests/TestHarness.psm1 -Force
          $r = Invoke-TestHarness -IgnoreCodeCoverage
          "$($r.PassedCount) passed, $($r.FailedCount) failed, $($r.SkippedCount) skipped" | Write-Host
          # Same condition as the main leg's Pester gate: FailedCount alone misses a container
          # that never ran at all.
          if ($r.FailedCount -gt 0 -or $r.FailedContainersCount -gt 0 -or $r.Result -ne 'Passed') {
              $failed = $r.FailedContainers | ForEach-Object { $_.Name }
              throw "$($r.FailedCount) test(s) failed, $($r.FailedContainersCount) container(s) failed: $($failed -join ', ')"
          }
          # The same margin the main leg carries, for the same reason: this is the host the
          # Pester total has to be true on, and nothing measures it outside this job.
          $floor = 333
          $ran = [int]$r.PassedCount + [int]$r.SkippedCount
          if ($ran -lt $floor) {
              throw "Only $ran test(s) ran on this host, expected at least $floor."
          }
          '@
          Set-Content -Path compat-surface-tests.ps1 -Value $probe -Encoding utf8
          $env:MGX_EXPECT_PSVERSION = '${{ matrix.psversion }}'
          pwsh -NoProfile -File ./compat-surface-tests.ps1
          if ($LASTEXITCODE -ne 0) { throw "surface tests failed on PowerShell ${{ matrix.psversion }}" }

  # Module load and ALC resolution are irreversible in-process, so tests/Ecosystem spawns a
  # child pwsh per load-order permutation. The neighbors are real Gallery installs because the
  # failure being hunted is a binding conflict against the assemblies those modules actually
  # ship - Az.Accounts carries its own System.Text.Json - which no mock can reproduce.
  ecosystem:
    name: Ecosystem isolation
    runs-on: windows-latest
    needs: build-and-test
    if: github.repository == 'gromedev/mgx'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Mgx.slnx

      - name: Install platyPS
        shell: pwsh
        run: Install-PSResource -Name platyPS -TrustRepository -Scope AllUsers

      - name: Build module
        shell: pwsh
        run: ./build.ps1 -Configuration Release

      - name: Install ecosystem modules
        shell: pwsh
        run: |
          # The matrix throws rather than skips when one is missing, so a failed install
          # fails here, loudly, not inside a permutation.
          Install-PSResource -Name Az.Accounts, PnP.PowerShell, ExchangeOnlineManagement -TrustRepository -Scope AllUsers

      - name: Run ecosystem matrix
        shell: pwsh
        run: |
          Import-Module ./tests/TestHarness.psm1
          $r = Invoke-TestHarness -TestPath ./tests/Ecosystem -TestResultsFile TestResults/ecosystem-results.xml
          if ($r.FailedCount -gt 0) { throw "$($r.FailedCount) ecosystem permutation(s) failed." }

          # Nine permutations, one test each. The floor is exact: deleting a permutation
          # must drop the count below it rather than pass as a smaller green run.
          $floor = 9
          if ($r.PassedCount -lt $floor) {
              throw "Only $($r.PassedCount) ecosystem permutation(s) ran, expected at least $floor. The matrix is not running."
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecosystem-results
          path: TestResults/ecosystem-results.xml
          if-no-files-found: ignore
